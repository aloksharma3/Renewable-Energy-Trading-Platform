# ============================================================
# Supervisord — manages all services in one container
# ============================================================
# Start order matters:
#   1. data_service   (fetches external data)
#   2. forecast       (needs data_service)
#   3. rag            (independent, but slow to start)
#   4. trading        (needs forecast + rag)
#   5. dashboard      (needs all services)
#   6. scheduler      (triggers pipeline — starts last)
#   7. nginx          (reverse proxy — can start anytime)
#
# priority: lower number = starts first
# ============================================================

[supervisord]
nodaemon=true
user=user
logfile=/var/log/supervisor/supervisord.log
pidfile=/tmp/supervisord.pid
childlogdir=/var/log/supervisor

# ─── Nginx (reverse proxy) ─────────────────────────────────
[program:nginx]
command=nginx -g "daemon off;"
priority=1
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# ─── Data Service ──────────────────────────────────────────
[program:data_service]
command=uvicorn main:app --host 0.0.0.0 --port 8001
directory=/app/data_service
priority=10
autostart=true
autorestart=true
startsecs=5
environment=HOME="/home/user"
stdout_logfile=/var/log/supervisor/data_service.log
stderr_logfile=/var/log/supervisor/data_service_err.log
stdout_logfile_maxbytes=1MB
stderr_logfile_maxbytes=1MB

# ─── Forecast Service ─────────────────────────────────────
[program:forecast_service]
command=uvicorn main:app --host 0.0.0.0 --port 8002
directory=/app/forecast_service
priority=20
autostart=true
autorestart=true
startsecs=8
environment=DATA_SERVICE_URL="http://localhost:8001",MODEL_DIR="/app/models",FORECAST_DB_PATH="/app/data/forecast/forecast.db"
stdout_logfile=/var/log/supervisor/forecast_service.log
stderr_logfile=/var/log/supervisor/forecast_service_err.log
stdout_logfile_maxbytes=1MB
stderr_logfile_maxbytes=1MB

# ─── RAG Service ──────────────────────────────────────────
[program:rag_service]
command=uvicorn main:app --host 0.0.0.0 --port 8004
directory=/app/rag_service
priority=20
autostart=true
autorestart=true
startsecs=8
environment=HOME="/home/user"
stdout_logfile=/var/log/supervisor/rag_service.log
stderr_logfile=/var/log/supervisor/rag_service_err.log
stdout_logfile_maxbytes=1MB
stderr_logfile_maxbytes=1MB

# ─── Trading Service ──────────────────────────────────────
[program:trading_service]
command=uvicorn main:app --host 0.0.0.0 --port 8003
directory=/app/trading_service
priority=30
autostart=true
autorestart=true
startsecs=10
environment=FORECAST_SERVICE_URL="http://localhost:8002",RAG_SERVICE_URL="http://localhost:8004",DB_PATH="/app/data/trading/trading.db"
stdout_logfile=/var/log/supervisor/trading_service.log
stderr_logfile=/var/log/supervisor/trading_service_err.log
stdout_logfile_maxbytes=1MB
stderr_logfile_maxbytes=1MB

# ─── Streamlit Dashboard ─────────────────────────────────
[program:dashboard]
command=streamlit run app.py --server.port=8501 --server.headless=true --server.address=0.0.0.0 --browser.gatherUsageStats=false
directory=/app/dashboard
priority=40
autostart=true
autorestart=true
startsecs=10
environment=DATA_SERVICE_URL="http://localhost:8001",FORECAST_SERVICE_URL="http://localhost:8002",TRADING_SERVICE_URL="http://localhost:8003",RAG_SERVICE_URL="http://localhost:8004"
stdout_logfile=/var/log/supervisor/dashboard.log
stderr_logfile=/var/log/supervisor/dashboard_err.log
stdout_logfile_maxbytes=1MB
stderr_logfile_maxbytes=1MB

# ─── Scheduler (background pipeline) ─────────────────────
[program:scheduler]
command=python main.py
directory=/app/scheduler
priority=50
autostart=true
autorestart=true
startsecs=15
environment=DATA_SERVICE_URL="http://localhost:8001",FORECAST_SERVICE_URL="http://localhost:8002",TRADING_SERVICE_URL="http://localhost:8003",RAG_SERVICE_URL="http://localhost:8004"
stdout_logfile=/var/log/supervisor/scheduler.log
stderr_logfile=/var/log/supervisor/scheduler_err.log
stdout_logfile_maxbytes=1MB
stderr_logfile_maxbytes=1MB
