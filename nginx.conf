# ============================================================
# Nginx reverse proxy for Hugging Face Spaces
# ============================================================
# HF exposes only port 7860. Nginx routes requests:
#   /                → Streamlit dashboard (:8501)
#   /api/data/       → data_service (:8001)
#   /api/forecast/   → forecast_service (:8002)
#   /api/trading/    → trading_service (:8003)
#   /api/rag/        → rag_service (:8004)
# ============================================================

worker_processes 1;
pid /tmp/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 128;
}

http {
    # Temp paths writable by non-root user
    client_body_temp_path /tmp/client_body;
    proxy_temp_path       /tmp/proxy;
    fastcgi_temp_path     /tmp/fastcgi;
    uwsgi_temp_path       /tmp/uwsgi;
    scgi_temp_path        /tmp/scgi;

    access_log /var/log/nginx/access.log;

    # ─── API routes ───────────────────────────────────

    upstream data_service    { server 127.0.0.1:8001; }
    upstream forecast_service { server 127.0.0.1:8002; }
    upstream trading_service  { server 127.0.0.1:8003; }
    upstream rag_service      { server 127.0.0.1:8004; }
    upstream dashboard        { server 127.0.0.1:8501; }

    server {
        listen 7860;
        server_name _;

        # ── Data service ──
        location /api/data/ {
            rewrite ^/api/data/(.*) /$1 break;
            proxy_pass http://data_service;
            proxy_set_header Host $host;
        }

        # ── Forecast service ──
        location /api/forecast/ {
            rewrite ^/api/forecast/(.*) /$1 break;
            proxy_pass http://forecast_service;
            proxy_set_header Host $host;
        }

        # ── Trading service ──
        location /api/trading/ {
            rewrite ^/api/trading/(.*) /$1 break;
            proxy_pass http://trading_service;
            proxy_set_header Host $host;
        }

        # ── RAG service ──
        location /api/rag/ {
            rewrite ^/api/rag/(.*) /$1 break;
            proxy_pass http://rag_service;
            proxy_set_header Host $host;
        }

        # ── Streamlit dashboard (default route) ──
        location / {
            proxy_pass http://dashboard;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 86400;
        }

        # ── Streamlit websocket ──
        location /_stcore/stream {
            proxy_pass http://dashboard/_stcore/stream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 86400;
        }
    }
}
